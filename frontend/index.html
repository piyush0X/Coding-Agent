<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Coding Agent</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">&lt;/&gt;</div>

            <div>
                <h2>Coding Agent</h2>
                <span>Powered by Ollama</span>
            </div>
        </div>


        <button
            class="new-chat"
            onclick="newChat()"
        >
            <span>+</span>
            New Chat
        </button>


        <div class="sidebar-section">

            <p class="section-title">
                FEATURES
            </p>

            <button onclick="usePrompt('Write a Python program to')">
                🐍 Python
            </button>

            <button onclick="usePrompt('Write a Java program to')">
                ☕ Java
            </button>

            <button onclick="usePrompt('Create a Flutter application that')">
                📱 Flutter
            </button>

            <button onclick="usePrompt('Debug this code:')">
                🐞 Debug Code
            </button>

            <button onclick="usePrompt('Explain this code:')">
                📖 Explain Code
            </button>

        </div>


        <div class="sidebar-bottom">

            <div class="model-info">

                <span class="status-dot"></span>

                <div>
                    <strong>Ollama</strong>
                    <small>qwen2.5-coder:7b</small>
                </div>

            </div>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <!-- HEADER -->

        <header class="header">

            <div>

                <h1>Coding Agent</h1>

                <p>
                    Your local AI programming assistant
                </p>

            </div>

            <div class="connection">

                <span class="status-dot"></span>

                <span>
                    Local
                </span>

            </div>

        </header>


        <!-- CHAT -->

        <section
            id="chat"
            class="chat"
        >

            <div
                id="welcome"
                class="welcome"
            >

                <div class="welcome-icon">
                    &lt;/&gt;
                </div>

                <h2>
                    What can I help you code?
                </h2>

                <p>
                    Ask me to write, explain, debug, or improve your code.
                </p>


                <div class="suggestions">

                    <button
                        onclick="usePrompt('Create a Python calculator program')"
                    >
                        <strong>💻 Generate Code</strong>
                        <span>Create a program from scratch</span>
                    </button>


                    <button
                        onclick="usePrompt('Explain this code and tell me how it works:')"
                    >
                        <strong>📚 Explain Code</strong>
                        <span>Understand code step by step</span>
                    </button>


                    <button
                        onclick="usePrompt('Find and fix the bugs in this code:')"
                    >
                        <strong>🐞 Debug</strong>
                        <span>Find and fix programming errors</span>
                    </button>


                    <button
                        onclick="usePrompt('Optimize this code:')"
                    >
                        <strong>⚡ Optimize</strong>
                        <span>Improve performance and quality</span>
                    </button>

                </div>

            </div>

        </section>


        <!-- INPUT -->

        <div class="input-area">

            <div class="input-wrapper">

                <textarea
                    id="question"
                    placeholder="Ask Coding Agent anything..."
                    rows="1"
                    onkeydown="handleKeyDown(event)"
                ></textarea>


                <button
                    id="sendButton"
                    class="send-button"
                    onclick="sendMessage()"
                >
                    ➤
                </button>

            </div>


            <div class="input-footer">

                <span>
                    Enter to send • Shift + Enter for new line
                </span>

                <span>
                    Powered by Ollama
                </span>

            </div>

        </div>

    </main>

</div>


<script src="script.js"></script>

</body>

</html>
